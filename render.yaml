services:
  - type: web
    name: cs2-market
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: DATABASE_FILE
        value: /var/data/cs2-market.sqlite
    disk:
      name: cs2-market-data
      mountPath: /var/data
      sizeGB: 1
